<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation</title>
    <!-- تضمين مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- تضمين خطوط جوجل العربية (Amiri) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Amiri', serif;
        background-color: #0b291d;
        overflow-x: hidden; /* لمنع أي سكرول عرضي */
        margin: 0;
        padding: 0;
    }

    /* تحسين تجاوب الصندوق الرئيسي على الموبايل */
    #envelopeContainer {
        width: 90% !important;
        max-width: 400px !important;
        box-sizing: border-box;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    /* جعل الصورة مرنة ومتناسبة مع شاشات الموبايل الضيقة */
    img {
        max-width: 100%;
        height: auto;
    }

    /* ضبط حجم خط الزر والنصوص في الموبايل لكي لا تخرج عن البرواز */
    @media (max-width: 480px) {
        #enterBtn span {
            font-size: 1.1rem !important; /* تصغير حجم الخط قليلاً في الشاشات الصغيرة جداً */
            gap: 8px !important;
        }
        #envelopeContainer {
            padding: 20px !important; /* تقليل الحشو الداخلي ليناسب الموبايل */
            gap: 25px !important;
        }
    }
</style>
    <style>
        body {
            font-family: 'Amiri', serif;
            background-color: #0b291d;
            overflow: hidden;
        }
        /* أنيميشن ناعم وظهور تدريجي للصندوق */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-fade-in {
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- خلفية جمالية متحركة خفيفة (إضاءة ناعمة) -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#133827] via-[#0b291d] to-[#071c13] -z-10"></div>

    <!-- الصندوق الرئيسي (الظرف) -->
    <div id="envelopeContainer" class="bg-[#0b291d]/90 backdrop-blur-md border border-[#BF953F]/40 rounded-[40px] shadow-[0_20px_50px_rgba(0,0,0,0.5)] p-8 md:p-12 flex flex-col items-center gap-10 w-full max-w-md transition-all duration-700 hover:border-[#BF953F] hover:shadow-[0_25px_60px_rgba(191,149,63,0.15)] animate-fade-in">
        
        <!-- قسم الصورة (الخواتم) مع تأثير Hover راقي جداً -->
        <div class="relative group cursor-pointer p-4">
            <!-- هالة ذهبية خفيفة تظهر خلف الصورة عند المرور -->
            <div class="absolute inset-0 bg-gradient-to-r from-[#BF953F]/0 via-[#BF953F]/20 to-[#BF953F]/0 rounded-full filter blur-xl opacity-0 transition-opacity duration-500 group-hover:opacity-100"></div>
            
            <img src="imge/5atm.png" alt="خاتم الزواج" class="relative w-48 h-36 object-contain drop-shadow-2xl transition-all duration-700 ease-out group-hover:scale-110 group-hover:rotate-2">
        </div>

        <!-- زر الدخول الاحترافي -->
        <a href="main.html" id="enterBtn" class="group relative inline-flex items-center justify-center w-full py-4 px-8 overflow-hidden rounded-2xl bg-gradient-to-r from-[#113827] to-[#0b291d] border border-[#BF953F]/50 shadow-lg transition-all duration-500 hover:border-amber-300 hover:shadow-[0_0_25px_rgba(191,149,63,0.4)]">
            
            <!-- طبقة إضاءة متحركة داخل الزر عند الـ Hover -->
            <span class="absolute inset-0 bg-gradient-to-r from-transparent via-[#BF953F]/10 to-transparent -translate-x-full transition-transform duration-1000 group-hover:translate-x-full"></span>

            <!-- محتوى الزر (النص والأيقونات المتناسقة) -->
            <span class="relative flex items-center justify-center gap-4 text-[#FCF6BA] font-bold text-xl md:text-2xl tracking-wider transition-all duration-300 group-hover:text-amber-200">
                <!-- <i class="fa-solid fa-wand-magic-sparkles text-[#BF953F] text-2xl transition-transform duration-500 group-hover:rotate-180 group-hover:scale-125"></i> -->
                <span>الدخول للدعوة </span>
                <!-- <i class="fa-solid fa-wand-magic-sparkles text-[#BF953F] text-2xl transition-transform duration-500 group-hover:-rotate-180 group-hover:scale-125"></i> -->
            </span>
        </a>
    </div>

    <!-- 🎵 عنصر الصوت المخفي لضمان تشغيله فور الضغط -->
    <audio id="weddingAudio" preload="auto">
        <source src="your-audio-file.mp3" type="audio/mpeg"> <!-- استبدل بمسار الصوت الخاص بك -->
    </audio>

    <!-- سكربت التشغيل والانتقال السلس -->
    <script>
        const enterBtn = document.getElementById('enterBtn');
        const container = document.getElementById('envelopeContainer');
        const audio = document.getElementById('weddingAudio');

        enterBtn.addEventListener('click', function(e) {
            e.preventDefault(); // منع الانتقال اللحظي لضمان تنفيذ الصوت والأثر البصري

            // 1. محاولة تشغيل الموسيقى فوراً لتجاوز حظر المتصفحات
            if (audio) {
                audio.play().catch(err => {
                    console.log("Audio play blocked:", err);
                });
            }

            // 2. تخزين حالة تشغيل الموسيقى للصفحة التالية
            localStorage.setItem('playMusic', 'true');

            // 3. تأثير حركي سينمائي للخروج (تكبير وتلاشي أنيق)
            container.style.transform = 'scale(1.05)';
            container.style.opacity = '0';
            container.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';

            // 4. الانتقال للصفحة التالية بعد اكتمال الأنيميشن
            setTimeout(() => {
                window.location.href = enterBtn.getAttribute('href');
            }, 600);
        });
    </script>

</body>
</html>
